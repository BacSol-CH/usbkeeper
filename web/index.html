<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>usbkeeper — USB Ingest</title>
<style>
:root {
  --bg: #0c0f14;
  --panel: #141922;
  --panel-2: #1a212d;
  --line: #232c3b;
  --text: #d5dbe4;
  --dim: #6b7686;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --accent: #4da3ff;
  --green: #3ecf8e;
  --amber: #f0b34b;
  --red: #ff6b6b;
  --violet: #a78bfa;
  --cyan: #56d4dd;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

/* ---------- top bar ---------- */
header {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 18px;
  padding: 14px 22px;
  background: rgba(12,15,20,.92);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
header h1 {
  font-size: 15px; font-weight: 650; letter-spacing: .04em;
  text-transform: uppercase; color: var(--text);
}
header h1 .dot { color: var(--accent); }
.counts { display: flex; gap: 14px; font-family: var(--mono); font-size: 12.5px; }
.counts .c { color: var(--dim); white-space: nowrap; }
.counts .c b { font-weight: 600; }
.c.copying b { color: var(--accent); }
.c.done b { color: var(--green); }
.c.error b { color: var(--red); }
.spacer { flex: 1; }
.conn {
  font-family: var(--mono); font-size: 11px; color: var(--dim);
  display: flex; align-items: center; gap: 6px;
}
.conn i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); display: inline-block; }
.conn.live i { background: var(--green); box-shadow: 0 0 6px var(--green); }
.conn.poll i { background: var(--amber); }
button {
  font-family: var(--sans); font-size: 12.5px;
  background: var(--panel-2); color: var(--text);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 12px; cursor: pointer;
  transition: background .15s, border-color .15s;
}
button:hover { background: #222b39; border-color: #31405a; }
button:active { transform: translateY(1px); }
#bell.on { border-color: var(--green); color: var(--green); }

/* ---------- grid ---------- */
main { padding: 20px 22px 120px; }
.grid {
  display: grid; gap: 16px;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
}

/* ---------- card ---------- */
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px 18px 14px;
  display: flex; flex-direction: column; gap: 10px;
  min-height: 230px;
  transition: border-color .3s, opacity .3s;
}
.card > .body { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card > .body > .spark-wrap { margin-top: auto; }
.card.empty { opacity: .45; }
.card.s-done { border-color: rgba(62,207,142,.55); background: linear-gradient(180deg, rgba(62,207,142,.07), transparent 55%), var(--panel); }
.card.s-error { border-color: rgba(255,107,107,.6); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,107,0); }
  50%      { box-shadow: 0 0 22px 0 rgba(255,107,107,.18); }
}
.card-head { display: flex; align-items: center; gap: 10px; }
.port-id { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--text); }
.speed-tag {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .05em;
  padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim);
}
.speed-tag.usb3 { color: var(--cyan); border-color: rgba(86,212,221,.35); }
.state-chip {
  margin-left: auto;
  font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
  padding: 3px 10px; border-radius: 999px;
  background: var(--panel-2); color: var(--dim); border: 1px solid var(--line);
}
.state-chip.st-mounting   { color: var(--violet); border-color: rgba(167,139,250,.4); }
.state-chip.st-copying    { color: var(--accent); border-color: rgba(77,163,255,.45); }
.state-chip.st-verifying  { color: var(--cyan);   border-color: rgba(86,212,221,.45); }
.state-chip.st-formatting { color: var(--amber);  border-color: rgba(240,179,75,.45); }
.state-chip.st-done       { color: var(--green);  border-color: rgba(62,207,142,.5); }
.state-chip.st-error      { color: var(--red);    border-color: rgba(255,107,107,.55); }
.state-chip.st-detected   { color: var(--text);   border-color: #3a4658; }
.state-chip.st-unmounting { color: var(--dim); }

.identity { font-family: var(--mono); font-size: 12.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.identity .ser { color: var(--dim); }
.identity .size { color: var(--dim); }
.subtle-line { font-family: var(--mono); font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dest { font-family: var(--mono); font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
.err-msg {
  font-family: var(--mono); font-size: 11.5px; color: var(--red);
  background: rgba(255,107,107,.08); border: 1px solid rgba(255,107,107,.25);
  border-radius: 8px; padding: 6px 9px;
}
.empty-note { margin: auto 0; color: var(--dim); font-size: 12.5px; font-family: var(--mono); }

/* progress */
.prog-row { display: flex; align-items: baseline; gap: 10px; font-family: var(--mono); font-size: 12px; }
.pct { font-size: 17px; font-weight: 650; color: var(--text); min-width: 58px; }
.rate { color: var(--accent); }
.eta { color: var(--dim); margin-left: auto; }
.bar {
  height: 8px; border-radius: 999px; background: var(--panel-2);
  border: 1px solid var(--line); overflow: hidden;
}
.bar > i {
  display: block; height: 100%; width: 0%;
  background: linear-gradient(90deg, #2f7fd6, var(--accent));
  border-radius: 999px;
  transition: width .45s linear;
}
.card.s-done .bar > i { background: linear-gradient(90deg, #27a06b, var(--green)); }
.card.s-error .bar > i { background: linear-gradient(90deg, #b3453f, var(--red)); }
.card.s-verifying .bar > i { background: linear-gradient(90deg, #2fa8ae, var(--cyan)); }
.card.s-formatting .bar > i { background: linear-gradient(90deg, #c98a2e, var(--amber)); }
.bar > i.indet { width: 30%; animation: indet-slide 1.1s ease-in-out infinite; }
@keyframes indet-slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }

.spark-wrap { display: flex; align-items: center; gap: 8px; }
canvas.spark { width: 100%; height: 42px; display: block; }
.spark-cap { font-family: var(--mono); font-size: 10px; color: var(--dim); white-space: nowrap; }

.totals { font-family: var(--mono); font-size: 11.5px; color: var(--green); }

/* ---------- toasts ---------- */
#toasts {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  display: flex; flex-direction: column-reverse; gap: 8px;
  padding: 14px 22px; pointer-events: none;
}
.toast {
  align-self: end;
  background: var(--panel-2); border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 10px; padding: 9px 14px;
  font-size: 13px; box-shadow: 0 8px 28px rgba(0,0,0,.5);
  animation: slidein .25s ease-out;
  max-width: min(420px, 90vw);
}
.toast.ok  { border-left-color: var(--green); }
.toast.bad { border-left-color: var(--red); }
.toast small { display: block; color: var(--dim); font-family: var(--mono); font-size: 11px; }
@keyframes slidein { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.toast.out { opacity: 0; transform: translateX(20px); transition: all .3s; }
</style>
</head>
<body>
<header>
  <h1>usb<span class="dot">keeper</span></h1>
  <div class="counts" id="counts">
    <span class="c copying"><b id="n-copy">0</b> copying</span>
    <span class="c done"><b id="n-done">0</b> done</span>
    <span class="c error"><b id="n-err">0</b> errors</span>
  </div>
  <div class="spacer"></div>
  <div class="conn" id="conn"><i></i><span id="conn-txt">connecting…</span></div>
  <button id="rescan" title="POST /api/rescan">⟳ Rescan</button>
  <button id="bell" title="Enable desktop notifications">🔔 Notify</button>
</header>

<main><div class="grid" id="grid"></div></main>
<div id="toasts"></div>

<script>
"use strict";
/* ================= helpers ================= */
const $ = (id) => document.getElementById(id);
const SB = 1024 ** 3; // use decimal GB like the data contract: 1e9
const GB = 1e9;

function fmtSize(bytes) {
  if (bytes == null) return "—";
  const b = Number(bytes);
  if (b >= 1e12) return (b / 1e12).toFixed(2) + " TB";
  if (b >= 1e9)  return (b / 1e9).toFixed(1) + " GB";
  if (b >= 1e6)  return (b / 1e6).toFixed(1) + " MB";
  return Math.round(b) + " B";
}
function fmtRate(bps) {
  if (!bps || bps <= 0) return "0 MB/s";
  return (bps / 1e6).toFixed(1) + " MB/s";
}
function fmtEta(sec) {
  if (sec == null || sec <= 0) return "—";
  sec = Math.round(sec);
  if (sec < 60) return sec + " s";
  const m = Math.floor(sec / 60), s = sec % 60;
  if (m < 60) return (s === 0 ? m + " min" : m + " min " + s + " s");
  const h = Math.floor(m / 60);
  return h + " h " + (m % 60) + " min";
}
function speedLabel(sp) {
  if (sp === "5000") return "USB3";
  if (sp === "480")  return "USB2";
  return "USB?";
}
const ACTIVE = new Set(["detected","mounting","copying","verifying","formatting","unmounting"]);

/* ================= state store ================= */
// per-port model: { port, speed, occupied, device, hist:[{t,r}], lastState }
const ports = new Map();
const cards = new Map(); // port -> DOM refs

function ensurePort(p) {
  let m = ports.get(p.port);
  if (!m) {
    m = { port: p.port, speed: p.speed, occupied: false, device: null, hist: [], lastState: null };
    ports.set(p.port, m);
  }
  if (p.speed) m.speed = p.speed;
  return m;
}

function applyPortPayload(p) {
  const m = ensurePort(p);
  const prevState = m.device ? m.device.state : null;
  m.occupied = !!p.occupied && !!p.device;
  m.device = m.occupied ? p.device : null;
  if (!m.occupied) { m.hist = []; m.lastState = null; }
  else if (p.device) {
    // throughput history for sparkline (sample on each event)
    if (p.device.state === "copying" && p.device.bytes_per_sec > 0) {
      m.hist.push({ t: Date.now(), r: p.device.bytes_per_sec });
      if (m.hist.length > 90) m.hist.shift();
    } else if (!ACTIVE.has(p.device.state)) {
      if (m.hist.length && (Date.now() - m.hist[m.hist.length - 1].t) > 4000) m.hist.push({ t: Date.now(), r: 0 });
    }
    // transition notifications
    const st = p.device.state;
    if (st !== prevState && (st === "done" || st === "error")) {
      notifyTransition(m, st);
    }
  }
  renderPort(m);
  updateCounts();
}

/* ================= rendering ================= */
function buildCard(m) {
  const el = document.createElement("article");
  el.className = "card empty";
  el.innerHTML = `
    <div class="card-head">
      <span class="port-id"></span>
      <span class="speed-tag"></span>
      <span class="state-chip"></span>
    </div>
    <div class="body"></div>`;
  $("grid").appendChild(el);
  const refs = {
    el,
    portId: el.querySelector(".port-id"),
    speed: el.querySelector(".speed-tag"),
    chip: el.querySelector(".state-chip"),
    body: el.querySelector(".body"),
    canvas: null, ctx: null, bar: null, pctEl: null, rateEl: null, etaEl: null, sig: "",
  };
  cards.set(m.port, refs);
  return refs;
}

function cardBodyHTML(m) {
  const d = m.device;
  if (!m.occupied) {
    return `<div class="empty-note">free port · ${speedLabel(m.speed)} ${esc(m.port)}</div>`;
  }
  let html = `
    <div class="identity" title="${esc(d.vendor)} ${esc(d.model)} · ${esc(d.serial)} · ${fmtSize(d.size_bytes)}">
      ${esc(d.vendor)} ${esc(d.model)} <span class="ser">#${esc(d.serial)}</span> <span class="size">${fmtSize(d.size_bytes)}</span>
    </div>`;
  if (d.state === "error") {
    html += `<div class="err-msg">${esc(d.error || "unknown error")}</div>`;
    html += `<div class="dest" title="${esc(d.dest)}">${esc(d.dest)}</div>`;
    return html;
  }
  if (d.state === "done") {
    html += `<div class="totals">✓ ${fmtSize(d.bytes_total)} archived → ${esc(d.dest.split("/").pop())}</div>`;
    html += `<div class="dest" title="${esc(d.dest)}">${esc(d.dest)}</div>`;
    html += sparkHTML();
    return html;
  }
  // active states
  const hasPct = d.pct != null;
  const barInner = hasPct
    ? `<i style="width:${Math.max(0, Math.min(100, d.pct))}%"></i>`
    : `<i class="indet"></i>`;
  html += `<div class="prog-row">
      <span class="pct">${hasPct ? d.pct.toFixed(1) + "%" : "measuring"}</span>
      <span class="rate">${fmtRate(d.bytes_per_sec)}</span>
      <span class="eta">${(hasPct || d.eta_sec != null) ? "ETA " + fmtEta(d.eta_sec) : ""}</span>
    </div>
    <div class="bar">${barInner}</div>
    <div class="subtle-line">${fmtSize(d.bytes_done)} / ${fmtSize(d.bytes_total)} · dev ${esc(d.dev)} · ${esc(d.fs)}</div>`;
  html += `<div class="dest" title="${esc(d.dest)}">${esc(d.dest)}</div>`;
  html += sparkHTML();
  return html;
}
function sparkHTML() {
  return `<div class="spark-wrap"><canvas class="spark"></canvas><span class="spark-cap">MB/s</span></div>`;
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderPort(m) {
  const r = cards.get(m.port) || buildCard(m);
  const d = m.device;
  const state = m.occupied ? d.state : "idle";
  // cheap signature to avoid needless innerHTML churn mid-animation
  const sig = [
    m.occupied ? "1" : "0", state,
    d ? (Math.round((d.pct ?? 0) * 2) / 2) : "",
    d ? fmtRate(d.bytes_per_sec) : "",
    d ? fmtEta(d.eta_sec) : "",
    d ? d.error : "",
    d ? d.serial : "",
    m.hist.length ? Math.round(m.hist[m.hist.length - 1].r / 1e6) : 0,
  ].join("|");
  if (sig === r.sig) { drawSpark(r, m); return; }
  r.sig = sig;

  r.el.classList.toggle("empty", !m.occupied);
  r.el.classList.remove("s-done", "s-error");
  if (m.occupied && state === "done") r.el.classList.add("s-done");
  if (m.occupied && state === "error") r.el.classList.add("s-error");

  r.portId.textContent = m.port;
  r.speed.textContent = speedLabel(m.speed);
  r.speed.classList.toggle("usb3", m.speed === "5000");
  r.chip.textContent = state;
  r.chip.className = "state-chip st-" + state;
  r.body.innerHTML = cardBodyHTML(m);

  r.canvas = r.body.querySelector("canvas.spark");
  if (r.canvas) {
    const w = Math.max(120, r.canvas.clientWidth || r.canvas.parentElement.clientWidth || 300);
    r.canvas.width = w * devicePixelRatio;
    r.canvas.height = 42 * devicePixelRatio;
    r.ctx = r.canvas.getContext("2d");
  }
  drawSpark(r, m);
}

function drawSpark(r, m) {
  if (!r.canvas || !r.ctx) return;
  const c = r.canvas, ctx = r.ctx, dpr = devicePixelRatio || 1;
  const W = c.width, H = c.height;
  ctx.clearRect(0, 0, W, H);
  const pts = m.hist;
  if (pts.length < 2) return;
  const maxR = Math.max(...pts.map(p => p.r), 1e6);
  const now = pts[pts.length - 1].t, span = Math.max(pts[pts.length - 1].t - pts[0].t, 1);
  const col = m.device && m.device.state === "done" ? "#3ecf8e" : "#4da3ff";
  ctx.lineWidth = 1.5 * dpr;
  ctx.strokeStyle = col;
  ctx.beginPath();
  pts.forEach((p, i) => {
    const x = ((p.t - pts[0].t) / span) * (W - 4 * dpr) + 2 * dpr;
    const y = H - 3 * dpr - (p.r / maxR) * (H - 8 * dpr);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.stroke();
  // soft fill
  ctx.lineTo(W - 2 * dpr, H); ctx.lineTo(2 * dpr, H); ctx.closePath();
  ctx.globalAlpha = 0.12; ctx.fillStyle = col; ctx.fill(); ctx.globalAlpha = 1;
}

function updateCounts() {
  let copy = 0, done = 0, err = 0;
  for (const m of ports.values()) {
    if (!m.device) continue;
    if (m.device.state === "copying") copy++;
    else if (m.device.state === "done") done++;
    else if (m.device.state === "error") err++;
  }
  $("n-copy").textContent = copy;
  $("n-done").textContent = done;
  $("n-err").textContent = err;
}

/* ================= transport: SSE + poll fallback ================= */
let es = null, pollTimer = null, sseOk = false;

function setConn(mode) { // 'live' | 'poll' | 'down'
  const c = $("conn");
  c.className = "conn " + (mode === "live" ? "live" : mode === "poll" ? "poll" : "");
  $("conn-txt").textContent = mode === "live" ? "SSE live" : mode === "poll" ? "polling 3s" : "offline";
}

function connectSSE() {
  if (es) { try { es.close(); } catch (e) {} }
  es = new EventSource("/events");
  es.addEventListener("open", () => { sseOk = true; setConn("live"); stopPoll(); });
  es.addEventListener("state", (ev) => {
    try { applyPortPayload(JSON.parse(ev.data)); } catch (e) { console.warn(e); }
  });
  es.addEventListener("error", () => {
    sseOk = false;
    es.close();
    setConn("poll");
    startPoll();
    setTimeout(connectSSE, 4000); // auto-reconnect
  });
}
function startPoll() {
  if (pollTimer) return;
  pollTimer = setInterval(fetchState, 3000);
  fetchState();
}
function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

async function fetchState() {
  try {
    const res = await fetch("/api/state", { cache: "no-store" });
    const j = await res.json();
    for (const p of j.ports) applyPortPayload(p);
    if (!sseOk) setConn("poll");
  } catch (e) {
    setConn("down");
  }
}

/* ================= notifications ================= */
let audioCtx = null;
function beep(kind) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.value = kind === "done" ? 880 : 320;
    g.gain.setValueAtTime(0.06, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
    o.connect(g).connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.38);
  } catch (e) {}
}
function toast(msg, sub, cls) {
  const t = document.createElement("div");
  t.className = "toast " + (cls || "");
  t.innerHTML = esc(msg) + (sub ? `<small>${esc(sub)}</small>` : "");
  $("toasts").appendChild(t);
  setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 350); }, 6000);
}
function notifyTransition(m, st) {
  const d = m.device;
  const msg = st === "done"
    ? `Stick ${d.vendor} done, ${fmtSize(d.bytes_total)} archived`
    : `Stick ${d.vendor} error: ${d.error || "failed"}`;
  toast(msg, `port ${m.port}`, st === "done" ? "ok" : "bad");
  beep(st === "done" ? "done" : "err");
  if (Notification.permission === "granted") {
    try { new Notification("usbkeeper", { body: msg, tag: m.port + st }); } catch (e) {}
  }
}

$("bell").addEventListener("click", async () => {
  if (!("Notification" in window)) { toast("Notifications unsupported", "", "bad"); return; }
  const perm = await Notification.requestPermission();
  if (perm === "granted") {
    $("bell").classList.add("on");
    toast("Desktop notifications enabled", "you'll be pinged on done/error");
  } else {
    toast("Notification permission denied", "", "bad");
  }
});
$("rescan").addEventListener("click", async () => {
  try {
    await fetch("/api/rescan", { method: "POST" });
    toast("Rescan triggered", "POST /api/rescan");
    fetchState();
  } catch (e) { toast("Rescan failed", "", "bad"); }
});

/* ================= boot ================= */
(async function boot() {
  await fetchState();          // full fleet incl. empty ports
  connectSSE();               // then stream deltas
  setInterval(() => { if (!sseOk) fetchState(); }, 3000); // hard fallback
})();
</script>
</body>
</html>
